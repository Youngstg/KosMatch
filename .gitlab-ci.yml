stages:
  - test
  - build
  - deploy

default:
  interruptible: true

variables:
  NODE_ENV: production
  PORT: "3001"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - node_modules/

test:
  stage: test
  image: node:22-slim
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run typecheck
    - npm run lint
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

build:
  stage: build
  image: node:22-slim
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
  artifacts:
    name: "kostmatch-build-$CI_COMMIT_SHORT_SHA"
    paths:
      - .next/
      - public/
      - package.json
      - package-lock.json
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync bash
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\tLogLevel ERROR\n" > ~/.ssh/config
  script:
    - echo "Deploying KostMatch to Tencent Cloud ($SERVER_IP)..."
    - ssh ${SERVER_USER}@${SERVER_IP} "mkdir -p /var/www/kostmatch"
    - rsync -avz --delete .next/ ${SERVER_USER}@${SERVER_IP}:/var/www/kostmatch/.next/
    - rsync -avz public/ ${SERVER_USER}@${SERVER_IP}:/var/www/kostmatch/public/
    - scp package.json package-lock.json ${SERVER_USER}@${SERVER_IP}:/var/www/kostmatch/
    - ssh ${SERVER_USER}@${SERVER_IP} "
        cd /var/www/kostmatch &&
        npm ci --omit=dev --prefer-offline &&
        (pm2 describe kostmatch > /dev/null 2>&1 && pm2 restart kostmatch --update-env || PORT=3001 pm2 start npm --name kostmatch -- start -- -p 3001) &&
        pm2 save
      "
    - echo "KostMatch deployment finished successfully!"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
