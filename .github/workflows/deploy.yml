name: Deploy KostMatch to Tencent Cloud

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck & Lint
        run: |
          npm run typecheck
          npm run lint

      - name: Build Next.js App
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kostmatch-build
          path: |
            .next/
            public/
            package.json
            package-lock.json
          retention-days: 1

  deploy:
    name: Deploy via SSH
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: kostmatch-build

      - name: Deploy to Tencent Cloud Server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

          echo "Ensuring remote directory exists..."
          ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_IP" "mkdir -p /var/www/kostmatch"

          echo "Syncing build files..."
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" --delete .next/ "$SERVER_USER@$SERVER_IP:/var/www/kostmatch/.next/"
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" public/ "$SERVER_USER@$SERVER_IP:/var/www/kostmatch/public/"
          scp -o StrictHostKeyChecking=no package.json package-lock.json "$SERVER_USER@$SERVER_IP:/var/www/kostmatch/"

          echo "Installing production dependencies & restarting PM2..."
          ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_IP" "
            cd /var/www/kostmatch &&
            npm ci --omit=dev --prefer-offline &&
            (pm2 describe kostmatch > /dev/null 2>&1 && pm2 restart kostmatch --update-env || PORT=3001 pm2 start npm --name kostmatch -- start -- -p 3001) &&
            pm2 save
          "
          echo "✅ KostMatch successfully deployed!"
